services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nutritionapp
      POSTGRES_USER: nutritionuser
      POSTGRES_PASSWORD: nutritionpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://nutritionuser:nutritionpass@db:5432/nutritionapp

volumes:
  postgres_data: