{% extends 'main/base.html' %}

{% block title %}Custom Recipe{% endblock %}



{% block content %}

{% block style %}
    <style>
        button{
            padding-right: 50px;
        }

        .addBtn, .removeBtn{
            font-size: larger;
        }

        textarea{
            height: 200px;
            width: 400px;
            overflow-y: auto;
        }
        
    </style>
{% endblock %}

<h1>New Recipe:</h1>

<form method="post">
    {% csrf_token %}

    
    <div class="my-3">
        <h4>Meal Name:</h4>
        <input type="text" name="title" id="title">
    </div>

    
    <div class="my-3" id="typeChk">
        <h4>Meal Type:</h4>
        <label for="snack">Snack</label>
        <input type="checkbox" name="type" id="snack" value="Snack">
        <label for="breakfast">Breakfast</label>
        <input type="checkbox" name="type" id="breakfast" value="Breakfast">
        <label for="lunch">Lunch</label>
        <input type="checkbox" name="type" id="lunch" value="Lunch">
        <label for="dinner">Dinner</label>
        <input type="checkbox" name="type" id="dinner" value="Lunch">
    </div>

    
    <div class="my-3" id="ingredient-container">
        <h4>Ingredients:</h4>
        <div id="ingredient-selections">
            <select name="ingredient-selection">
                {% for i in ingredients %}
                    <option value="{{ i.title }}">{{i.title}}({{i.measurement}})</option>
                {% endfor %}
            </select>
            <label for="ingredient-amount">Amount:</label>
            <input type="text" name="ingredient-amount">
        </div>
    </div>

    <div class="my-3">
        <button id="addBtn" class="btn btn-outline-primary" type="button">+</button>
        <button id="removeBtn" class="btn btn-outline-danger" type="button">x</button>
    </div>

    <div class="my-3" id="instructions">
        <textarea name="instructions" id="instructions" ></textarea>
    </div>

    <button type="submit" formaction="{% url 'recipes_list' %}" formmethod="get" id="cancel" class="btn btn-success mr-3 my-3">Back to recipe selection</button>
    <button type="submit" id="save" class="btn btn-success mx-3 my-3">Save Recipe</button>
</form>

<script>
    document.getElementById("addBtn").onclick = () => {
        div1 = document.getElementById("ingredient-selections");
        newDiv = div1.cloneNode(true);

        document.getElementById("ingredient-container").appendChild(newDiv);
    }
    document.getElementById("removeBtn").onclick = () => {
        container = document.getElementById("ingredient-container");
        container.removeChild(container.lastChild);
    }
</script>





{% endblock %}
